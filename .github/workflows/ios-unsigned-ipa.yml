name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out NuvioMobile
        uses: actions/checkout@v4
        with:
          path: NuvioMobile
          fetch-depth: 1


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: NuvioMobile/**/*.gradle*

      - name: Check out pinned MPVKit
        working-directory: NuvioMobile
        run: |
          git clone --filter=blob:none https://github.com/NuvioMedia/MPVKit.git MPVKit
          git -C MPVKit checkout d5cf091c80368bbbc1bbf2d195fbc55d926df888


      - name: Build unsigned device application
        working-directory: NuvioMobile
        env:
          NUVIO_IOS_DISTRIBUTION: appstore
          GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2g
          KOTLIN_DAEMON_JVMARGS: -Xmx6g
        run: |
          touch local.properties
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Package and verify IPA
        working-directory: NuvioMobile
        run: |
          app="build/ios-device/Build/Products/Release-iphoneos/Nuvio.app"
          test -d "$app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (
            cd build/ipa
            /usr/bin/zip -qry ../Nuvio-0.4.7-appstore-unsigned.ipa Payload
          )
          /usr/bin/unzip -t build/Nuvio-0.4.7-appstore-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = "iPhoneOS"
          test "$(find build/ipa/Payload -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')" = "1"
          shasum -a 256 build/Nuvio-0.4.7-appstore-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-0.4.7-appstore-unsigned-ipa
          path: NuvioMobile/build/Nuvio-0.4.7-appstore-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
